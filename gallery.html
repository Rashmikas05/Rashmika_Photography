.gallery-hero .section-label {

.gallery-hero .section-label::after {

.gallery-hero h1 {

.masonry-container {
    padding: 0 5% 100px;

.masonry-grid {
    column-count: 4;
    column-gap: 20px;
}

.masonry-item {
    break-inside: avoid;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #e8e5de;
    border-radius: 4px;
}

.masonry-item img {
    width: 100%;
    display: block;
    transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), filter 0.5s ease;
}

.masonry-item:hover img {
    transform: scale(1.038);
}

.masonry-item::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
}

.masonry-item:hover::after {
    opacity: 1;
}

.item-caption {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    z-index: 2;
    color: #ffffff;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.masonry-item:hover .item-caption {
    opacity: 1;
    transform: translateY(0);
}

.reveal {
    opacity: 0;
    transform: translateY(45px);
    transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: opacity, transform;
}

.reveal.show {
    opacity: 1;
    transform: translateY(0);
}

.lightbox-modal {
    position: fixed;
    inset: 0;
    background: rgba(18, 18, 16, 0.7);
    backdrop-filter: blur(8px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
    padding: 30px;
}

.lightbox-modal.active {
    opacity: 1;
    visibility: visible;
}

.lightbox-content {
    max-width: 90vw;
    max-height: 85vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.lightbox-img {

    border-radius: 2px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    transform: scale(0.95);
    transition: transform 0.35s ease;
}

.lightbox-modal.active .lightbox-img {
    transform: scale(1);
}

.lightbox-caption {

    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 18px;
    text-align: center;

.lightbox-close:hover {

/* =========================
   2. RENDER GALLERY ITEMS
========================= */
const galleryGrid = document.getElementById("galleryGrid");

function renderGallery() {
    galleryGrid.innerHTML = ""; // Clear existing grid

    galleryData.forEach((item, index) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "masonry-item reveal";
        itemDiv.setAttribute("data-index", index);

        itemDiv.innerHTML = `
            <img src="${item.src}" alt="${item.alt || item.title}" loading="lazy">
            <div class="item-caption">${item.title}</div>
        `;

        galleryGrid.appendChild(itemDiv);
    });
}

// Gallery එක Screen එකට Render කිරීම
renderGallery();

/* =========================
   3. MOBILE MENU TOGGLE
========================= */
const menuToggle = document.getElementById("menuToggle");
const navArea = document.getElementById("navArea");

function closeMenu() {
    navArea.classList.remove("active");
    menuToggle.textContent = "☰";
    menuToggle.setAttribute("aria-expanded", "false");
}

menuToggle.addEventListener("click", function(event) {
    event.stopPropagation();
    navArea.classList.toggle("active");
    const isOpen = navArea.classList.contains("active");
    menuToggle.setAttribute("aria-expanded", isOpen);
    menuToggle.textContent = isOpen ? "×" : "☰";
});

document.addEventListener("click", function(event) {
    if (navArea.classList.contains("active") && !navArea.contains(event.target) && !menuToggle.contains(event.target)) {
        closeMenu();
    }
});

document.querySelectorAll("nav a").forEach(link => {
    link.addEventListener("click", closeMenu);
});

window.addEventListener("resize", function() {
    if (window.innerWidth > 650) {
        closeMenu();
    }
});

/* =========================
   4. SCROLL REVEAL ANIMATIONS
========================= */
function initScrollReveal() {
    const revealElements = document.querySelectorAll(".reveal");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    if (prefersReducedMotion.matches) {
        revealElements.forEach(element => element.classList.add("show"));
    } else {
        const revealObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("show");
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.12,
            rootMargin: "0px 0px -40px 0px"
        });

        revealElements.forEach((element, index) => {
            const delay = (index % 4) * 0.12;
            element.style.transitionDelay = `${delay}s`;
            revealObserver.observe(element);
        });
    }
}

// Init animation after rendering photos
initScrollReveal();

/* =========================
   5. LIGHTBOX MODAL INTERACTION
========================= */
const lightboxModal = document.getElementById("lightboxModal");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxCaption = document.getElementById("lightboxCaption");
const lightboxClose = document.getElementById("lightboxClose");

// Delegate click event to grid for lightbox
galleryGrid.addEventListener("click", (e) => {
    const item = e.target.closest(".masonry-item");
    if (!item) return;

    const index = item.getAttribute("data-index");
    const photoData = galleryData[index];

    if (photoData) {
        lightboxImg.src = photoData.src;
        lightboxImg.alt = photoData.alt || photoData.title;
        lightboxCaption.textContent = photoData.title;
        lightboxModal.classList.add("active");
        document.body.style.overflow = "hidden";
    }
});

function closeLightbox() {
    lightboxModal.classList.remove("active");
    document.body.style.overflow = "";
}

lightboxClose.addEventListener("click", closeLightbox);

lightboxModal.addEventListener("click", (e) => {
    if (e.target === lightboxModal) {
        closeLightbox();
    }
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightboxModal.classList.contains("active")) {
        closeLightbox();
    }
});
</script>
